<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">To-Do</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Tasks</h5>
            <form id="task-form" class="row g-2 align-items-center mb-3">
              <div class="col-sm-9">
                <label for="task-title" class="visually-hidden">Task</label>
                <input type="text" id="task-title" class="form-control" placeholder="What needs to be done?" required>
              </div>
              <div class="col-sm-3 d-grid">
                <button type="submit" class="btn btn-primary">Add Task</button>
              </div>
            </form>

            <div id="alerts" class="mb-2"></div>

            <ul id="task-list" class="list-group"></ul>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.API_BASE = "../api/tasks.php";
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
